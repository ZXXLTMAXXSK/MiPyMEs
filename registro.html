<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta — ReservaPro</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animation.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="auth-page">
    <aside class="auth-visual" aria-hidden="true" style="background: linear-gradient(135deg, #0f172a, #4f46e5, #06b6d4);">
      <div class="auth-visual-content">
        <a href="index.html" class="logo" style="color:#fff;">
          <span class="logo-mark" style="background: rgba(255,255,255,.2);">R</span>
          <span>ReservaPro</span>
        </a>
        <div>
          <h2>Crea tu cuenta</h2>
          <p>Regístrate gratis en segundos para completar tu reserva y acceder a tu panel.</p>
        </div>
        <p style="font-size:.8125rem; opacity:.7;">© 2025 ReservaPro</p>
      </div>
    </aside>

    <main class="auth-form-wrapper">
      <div class="auth-form page-transition">

        <!-- Mensaje si viene de redirigir por intento de reserva -->
        <div id="authNotice" style="display: none; background: rgba(79, 70, 229, 0.1); border-left: 4px solid var(--color-primary); padding: 0.85rem; border-radius: 6px; margin-bottom: 1.5rem; font-size: 0.875rem; color: var(--color-text);">
          📝 Crea tu cuenta rápida para confirmar tu reserva.
        </div>

        <div class="auth-header">
          <h1>Crear cuenta</h1>
          <p>Completa tus datos para registrar tus reservas.</p>
        </div>

        <form id="registerForm" novalidate>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:.75rem;">
            <div class="form-group">
              <label for="nombre" class="form-label">Nombre <span class="required">*</span></label>
              <input type="text" id="nombre" class="form-input" placeholder="Juan" required autocomplete="given-name" />
            </div>
            <div class="form-group">
              <label for="apellido" class="form-label">Apellido <span class="required">*</span></label>
              <input type="text" id="apellido" class="form-input" placeholder="Pérez" required autocomplete="family-name" />
            </div>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Correo electrónico <span class="required">*</span></label>
            <input type="email" id="email" class="form-input" placeholder="tu@email.com" required autocomplete="email" />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Contraseña <span class="required">*</span></label>
            <input type="password" id="password" class="form-input" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" />
          </div>

          <div class="form-group">
            <label class="form-checkbox">
              <input type="checkbox" id="terminos" required checked />
              <span>Acepto los <a href="#" style="color: var(--color-primary);">términos y condiciones</a>.</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
            <span class="btn-text">Crear cuenta e ir a reservar</span>
          </button>
        </form>

        <p class="auth-footer" style="margin-top: 1.5rem;">
          ¿Ya tienes cuenta? <a id="loginLink" href="login.html">Inicia sesión</a>
        </p>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="js/main.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('redirect')) {
        document.getElementById('authNotice').style.display = 'block';
        document.getElementById('loginLink').href = `login.html?redirect=${urlParams.get('redirect')}`;
      }
    });
  </script>
</body>
</html>
